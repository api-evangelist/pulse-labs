name: Pulse Labs
description: >-
  Pulse Labs is an AI-powered user experience research platform, founded in
  2017, that helps product, design, and UX research teams gather and analyze
  real-world user feedback. The platform combines surveys, moderated and
  unmoderated interviews, task-based evaluations across web, mobile, smart
  devices, and automotive, and naturalistic observations, alongside its
  FlightRecorder SDK for embedded in-app feedback and session replay on iOS,
  Android, Web, React, and Flutter. Participant recruiting is powered by the
  proprietary Pulse Voices panel. Backed by Google, Amazon, Bezos Expeditions,
  Techstars, and Madrona Ventures, Pulse Labs emphasizes privacy, ethical AI,
  and enterprise-grade security including ISO 27001 certification and GDPR
  compliance. Pulse Labs does not currently publish a public REST API or
  OpenAPI; its developer-facing surface is the FlightRecorder embedded SDK and
  GitBook product documentation.
